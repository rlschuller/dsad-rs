[tool.poetry]
name = "dsad"
version = "0.1.0"
description = ""
authors = [
  "Rodrigo Loro Schuller <rodrigo.loro@impa.br>",
  "Francisco Ganacim <ganacim@impa.br>",
  "Paulo Orenstein <pauloo@impa.br>",
]
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "~3.11"
numpy = "^1.23.4"
pandas = "^1.5.1"
tqdm = "^4.64.1"
earthengine-api = "^0.1.332"
rasterio = "^1.3.4"
matplotlib = "^3.6.2"
tifffile = "^2022.10.10"
unique-names-generator = "^1.0.2"
#torchvision = "^0.14.1"
gdown = "^4.6.0"
geopandas = "^0.12.2"
jupyter = "^1.0.0"
jupytext = "^1.14.5"
nbconvert = "^7.3.0"
plt-cli = "^0.2"
torchinfo = "^1.7.2"
h5py = "^3.9.0"
haversine = "^2.8.0"
scikit-learn = "^1.3.2"
tabulate = "^0.9.0"
onnx = "^1.15.0"
onnxruntime = "^1.17.0"
tensorboard = "^2.15.2"
geemap = "^0.31.0"
transformers = "^4.39.3"
grad-cam = "^1.5.2"
ipympl = "^0.9.4"
libsixel-python = "^0.5.0"
torch = "^2.8.0"
torchvision = "^0.23.0"
orjson = "^3.11.4"
brokenaxes = "^0.6.2"
icecream = "^2.1.10"

[tool.poetry.dev-dependencies]
pynvim = "^0.4.3"
pre-commit = "^2.20.0"
black = "^22.10.0"
isort = "^5.10.1"
pyproject-flake8 = "^5.0.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
line_length = 120
multi_line_output = 3
include_trailing_comma = true
profile = "black"

[tool.flake8]
max-line-length = 120
max-complexity = 20
exclude = ".git"
select = "B,C,E,F,W,T4,B9"
ignore = "E203, E266, E501, W503, F403, F401"

[tool.pyright]
include = ["src"]
exclude = ["data", "models"]
typeCheckingMode = "off"

